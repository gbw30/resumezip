# Gives a pull request the severity label of the bug it fixes. If issue #123
# is "severity: critical" and a pull request's description says it fixes
# #123, the pull request gets "severity: critical" too, including when the
# issue only gets its severity later. Greptile's dashboard can then review
# pull requests with the labels that matter.
#
# pull_request_target runs this file as it is on main, so it can label pull
# requests from forks, and changes to it only apply once merged. It never
# checks out the pull request's code, and only copies labels the linked
# issues already have, so it's safe despite the trigger's reputation.

name: Pull request severity

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout; reads labels only
    types: [opened, edited, reopened, synchronize]
  # A bug can get its severity after a pull request for it is opened.
  issues:
    types: [labeled]

permissions:
  issues: read
  pull-requests: write

jobs:
  severity:
    name: Copy severity
    if: github.event_name != 'issues' || startsWith(github.event.label.name, 'severity:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const labelsOf = (node) => node.labels.nodes.map((label) => label.name)
            const addMissing = async (number, wanted, current) => {
              const missing = wanted.filter((name) => !current.includes(name))
              if (missing.length > 0) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: missing })
              }
            }

            if (context.eventName === "issues") {
              // An issue just got a severity: give it to the open pull requests that will close it.
              const { repository } = await github.graphql(
                `query ($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      closedByPullRequestsReferences(first: 100, includeClosedPrs: false) {
                        nodes { number labels(first: 100) { nodes { name } } }
                      }
                    }
                  }
                }`,
                { ...context.repo, number: context.issue.number },
              )
              for (const pullRequest of repository.issue.closedByPullRequestsReferences.nodes) {
                await addMissing(pullRequest.number, [context.payload.label.name], labelsOf(pullRequest))
              }
              return
            }

            // A pull request opened or changed: give it the severities of the issues it will close,
            // whether linked from its description ("fixes #123" and the like) or by hand.
            const { repository } = await github.graphql(
              `query ($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes { labels(first: 100) { nodes { name } } }
                    }
                  }
                }
              }`,
              { ...context.repo, number: context.issue.number },
            )
            const severities = [
              ...new Set(
                repository.pullRequest.closingIssuesReferences.nodes
                  .flatMap(labelsOf)
                  .filter((name) => name.startsWith("severity: ")),
              ),
            ]
            await addMissing(context.issue.number, severities, context.payload.pull_request.labels.map((label) => label.name))
