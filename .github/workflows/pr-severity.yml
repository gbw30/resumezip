# Gives a pull request the severity label of the bug it fixes: if issue #123
# is "severity: critical" and a pull request says it fixes #123, the pull
# request gets "severity: critical" too. Greptile's dashboard can then review pull requests with the
# labels that matter.
#
# pull_request_target runs this file as it is on main, so it works on pull
# requests from forks and changes to it only apply once merged. It never
# checks out the pull request's code, and only copies labels the linked
# issues already have.

name: Pull request severity

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: write

jobs:
  severity:
    name: Copy severity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            // The issues this pull request will close, from its description or linked by hand.
            const { repository } = await github.graphql(
              `query ($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes { labels(first: 20) { nodes { name } } }
                    }
                  }
                }
              }`,
              { ...context.repo, number: context.issue.number },
            )
            const severities = new Set(
              repository.pullRequest.closingIssuesReferences.nodes
                .flatMap((issue) => issue.labels.nodes.map((label) => label.name))
                .filter((name) => name.startsWith("severity: ")),
            )
            const current = new Set(context.payload.pull_request.labels.map((label) => label.name))
            const missing = [...severities].filter((name) => !current.has(name))
            if (missing.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: missing })
            }
