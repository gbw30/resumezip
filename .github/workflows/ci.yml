# Checks every pull request and every push to main. Main requires "Check"
# and "Browser tests", which uses the built site in real browsers, before a
# merge. "Audit" only reports, so a new advisory in a dependency can't block
# unrelated work.
#
# No path filters: a required check has to run on every pull request, or
# pull requests that skip it could never be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checkouts don't keep the token (persist-credentials: false): the jobs run
# the pull request's code and never need to push.
permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The version in package.json's engines.node, which Vercel uses too.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Test issue labels
        working-directory: .
        run: node --test .github/scripts/issue-labels.test.mjs
      - name: Build
        run: npm run build

  browser:
    name: Browser tests
    # Pinned, not ubuntu-latest: Playwright installs system libraries for the
    # exact Ubuntu release, and ubuntu-latest moves to Ubuntu 26 on
    # October 19, 2026. Move this when Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npm run test:browser
      # Screenshots and a replayable trace of whatever failed.
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/package.json
      # Only the packages that ship to visitors; build tools are left out.
      - name: Audit shipped packages
        run: npm audit --omit=dev --audit-level=high --package-lock-only
