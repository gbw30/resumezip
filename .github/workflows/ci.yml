# Checks every pull request and every push to main. "Check" is the one
# main requires before a merge; "Audit" only reports, so a new advisory
# in a dependency can't block unrelated work.
#
# No path filters: a required check has to run on every pull request, or
# pull requests that skip it could never be merged.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the run for the old commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The version in package.json's engines.node, which Vercel uses too.
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
      # Only the packages that ship to visitors; build tools are left out.
      - name: Audit shipped packages
        run: npm audit --omit=dev --audit-level=high --package-lock-only
