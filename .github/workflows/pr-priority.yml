# Gives a pull request the priority label of the issue it fixes. If issue #123
# is "P0: critical" and a pull request's description says it fixes #123, the
# pull request gets "P0: critical" too, including when the issue only gets
# its priority later. When the issue moves to another priority, the pull
# request moves with it. Greptile's dashboard can then review pull requests
# with the labels that matter.
#
# pull_request_target runs this file as it is on main, so it can label pull
# requests from forks, and changes to it only apply once merged. It never
# checks out the pull request's code, and only copies labels the linked
# issues already have, so it's safe despite the trigger's reputation.

name: Pull request priority

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout; reads labels only
    types: [opened, edited, reopened, synchronize]
  # An issue can get its priority, or move to another, after a pull request for it is opened.
  issues:
    types: [labeled, unlabeled]

permissions:
  issues: read
  pull-requests: write

jobs:
  priority:
    name: Copy priority
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.label.name, 'P0:') || startsWith(github.event.label.name, 'P1:') ||
      startsWith(github.event.label.name, 'P2:') || startsWith(github.event.label.name, 'P3:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const isPriority = (name) => /^P[0-3]: /.test(name)
            const labelsOf = (node) => node.labels.nodes.map((label) => label.name)

            // Makes a pull request's priority labels the priorities of the issues it will close.
            // One that closes no issue with a priority keeps whatever priority it has.
            const sync = async (number, current, closing) => {
              const wanted = [...new Set(closing.flatMap(labelsOf).filter(isPriority))]
              if (wanted.length === 0) return
              const missing = wanted.filter((name) => !current.includes(name))
              if (missing.length > 0) {
                await github.rest.issues.addLabels({ ...context.repo, issue_number: number, labels: missing })
              }
              for (const name of current.filter((name) => isPriority(name) && !wanted.includes(name))) {
                // Already gone is fine: something else took it off first.
                await github.rest.issues
                  .removeLabel({ ...context.repo, issue_number: number, name })
                  .catch((error) => {
                    if (error.status !== 404) throw error
                  })
              }
            }

            if (context.eventName === "issues") {
              // An issue got or lost a priority: bring the open pull requests that will close it in step.
              const { repository } = await github.graphql(
                `query ($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      closedByPullRequestsReferences(first: 50, includeClosedPrs: false) {
                        nodes {
                          number
                          labels(first: 100) { nodes { name } }
                          closingIssuesReferences(first: 50) { nodes { labels(first: 100) { nodes { name } } } }
                        }
                      }
                    }
                  }
                }`,
                { ...context.repo, number: context.issue.number },
              )
              for (const pullRequest of repository.issue.closedByPullRequestsReferences.nodes) {
                await sync(pullRequest.number, labelsOf(pullRequest), pullRequest.closingIssuesReferences.nodes)
              }
              return
            }

            // A pull request opened or changed: give it the priorities of the issues it will close,
            // whether linked from its description ("fixes #123" and the like) or by hand.
            const { repository } = await github.graphql(
              `query ($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes { labels(first: 100) { nodes { name } } }
                    }
                  }
                }
              }`,
              { ...context.repo, number: context.issue.number },
            )
            await sync(
              context.issue.number,
              context.payload.pull_request.labels.map((label) => label.name),
              repository.pullRequest.closingIssuesReferences.nodes,
            )
