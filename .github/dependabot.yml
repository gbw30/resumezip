# Weekly update pull requests, checked by CI like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # None, instead of Dependabot's own "dependencies" and "javascript" labels.
    labels: [ ]
    open-pull-requests-limit: 5
    # Major versions are migrations to plan, not weekly bumps: pdf.js 6,
    # ESLint 10 and TypeScript 7 each broke the build when Dependabot tried
    # them. This only skips version updates; security updates aren't affected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Moves only with react-pdf, which needs one exact version of it
      # (src/lib/pdfjsVersion.test.ts fails until they match).
      - dependency-name: "pdfjs-dist"
    groups:
      # Must move together: the compiler file loaded from jsDelivr is pinned
      # to this version (src/lib/typst/compilerSource.ts), and CI fails until
      # COMPILER_VERSION and COMPILER_INTEGRITY are updated to match.
      typst:
        patterns: ["@myriaddreamin/*"]
      # On its own, since updating it can mean setting pdfjs-dist to match.
      react-pdf:
        patterns: ["react-pdf"]
      # Everything else that doesn't change a major version, in one pull request.
      minor-and-patch:
        update-types: [minor, patch]

  # The workflows pin each action to a commit SHA with its version in a
  # comment; these updates move both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ ]
